name = "dr-maria-dental"
compatibility_date = "2024-09-01"
pages_build_output_dir = "out"

# Real KV namespace — create with:
#   npx wrangler kv namespace create RATE_LIMIT_KV
# then paste the id it prints below before deploying. Local `wrangler
# pages dev` works fine with a placeholder id (uses local emulated storage).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"
